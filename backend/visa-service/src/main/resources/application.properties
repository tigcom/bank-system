# Server configuration
server.port=8087
spring.application.name=visa-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/myrealm
# VISA API configuration
visa.api.url=http://localhost:8090/api/visa
visa.api.key=Mock-API-Key
visa.api.key.value=abc123xyz

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.visaRegistration.slidingWindowSize=10
resilience4j.circuitbreaker.instances.visaRegistration.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.visaRegistration.failureRateThreshold=50
resilience4j.circuitbreaker.instances.visaRegistration.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.visaRegistration.permittedNumberOfCallsInHalfOpenState=3

# Resilience4j Retry configuration
resilience4j.retry.instances.visaRegistration.maxAttempts=3
resilience4j.retry.instances.visaRegistration.waitDuration=1s
resilience4j.retry.instances.visaRegistration.enableExponentialBackoff=true
resilience4j.retry.instances.visaRegistration.exponentialBackoffMultiplier=2

# Logging configuration
logging.level.com.visa.visaservice=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
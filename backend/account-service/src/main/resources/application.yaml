server:
  port: 8082
  servlet:
    context-path: /account
app:
  api:
    key: QWErtyuiopaqwer

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3307/accountdb
    username: root
    password: 0986341885dai
  zipkin:
    base-url: http://zipkin:9411
    sleuth:
      sampler:
        probability: 1.0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/myrealm
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  messages:
    basename:
      - i18n/messages
    encoding: UTF-8
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${DOCKER_HOST:localhost}:9094
      bindings:
        mail-out-0:
          destination: send-mail-html
          content-type: application/json
dubbo:
  application:
    qos-enable: true
    qos-port: 22225
    name: account-service
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: zookeeper://localhost:2181
  scan:
    base-packages: com.example.account_service.service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retries,circuitbreakers
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
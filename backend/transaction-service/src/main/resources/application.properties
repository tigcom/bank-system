spring.application.name=transaction-service

server.port=8088

spring.datasource.username=root
spring.datasource.password=22572
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/transactionservice
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto= update
#spring.jpa.hibernate.ddl-auto= none

dubbo.application.name=transaction-service
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.application.serialize-check-status=DISABLE

dubbo.registry.address=zookeeper://localhost:2181
dubbo.provider.filters=dubboProviderSecurityFilter
dubbo.scan.base-packages=com.example.transaction_service.service,com.example.transaction_service.dubbo,com.example.transaction_service.filter

#i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

# Swagger Configurations
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Vault
spring.cloud.vault.uri=http://localhost:8200

spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=myroot

spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=myapp

# Cho phï¿½p Spring Boot import c?u hiï¿½nh vault
spring.config.import=optional:vault://

# Spring Security JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/myrealm

#Master account number
masterAccount = 421010688

#Redis
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123

spring.cloud.stream.kafka.binder.brokers=${DOCKER_HOST:localhost}:9094
spring.cloud.stream.bindings.mail-out-0.destination=send-mail-html
spring.cloud.stream.bindings.mail-out-0.content-type=application/json


mock-server-api-key=${mock-server-api-key}

#URL Core bank

core-banking.api-key=${core-banking.api-key}
provider.api.electricity.url=http://localhost:8089/mock-api/electricity
provider.api.telephone.url=http://localhost:8089/mock-api/telephone
core-banking.api.url=http://localhost:8083/corebanking/api/core-bank
mock-provider-api=http://localhost:8089/mock-api
mock-napas-api=http://localhost:8089/mock-napas

management.endpoints.web.exposure.include=health,info,metrics,retries,circuitbreakers
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# Server configuration
server:
  port: 8086

spring:
  application:
    name: master-service
  aop:
    proxy-target-class: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/myrealm

# Master API configuration
master:
  api:
    url: http://localhost:8091/api/master
    key: Mock-API-Key
    key-value: abc123xyz

# Resilience4j Configuration
resilience4j:
  retry:
    instances:
      mastercard-registration:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
        enable-exponential-backoff: true
        enable-random-jitter: false
        retry-exceptions:
          - org.springframework.web.client.RestClientException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - org.springframework.web.client.HttpServerErrorException$BadGateway
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.HttpServerErrorException$GatewayTimeout
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    configs:
      default:
        register-health-indicator: true
#  circuitbreaker:
#    instances:
#      mastercard-registration:
#        register-health-indicator: true
#        sliding-window-size: 20
#        minimum-number-of-calls: 10
#        permitted-number-of-calls-in-half-open-state: 5
#        automatic-transition-from-open-to-half-open-enabled: true
#        wait-duration-in-open-state: 60s
#        failure-rate-threshold: 70
#        event-consumer-buffer-size: 10

# Management endpoints for monitoring Resilience4j
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true
    retries:
      enabled: true

# Logging configuration for debugging retry
logging:
  level:
    io.github.resilience4j.retry: DEBUG
    com.master.masterservice: DEBUG
